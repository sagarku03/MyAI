name: Build & Release Agentra Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Prepare .env Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Restore Official Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "Error: Missing RELEASE_* GitHub Secrets for APK signing!"
            exit 1
          fi
          echo "Restoring release.jks from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          # Verify keystore integrity using environment-passed password
          STORE_PASS="$STORE_PASS" keytool -list -keystore release.jks -storepass:env STORE_PASS -alias "$KEY_ALIAS"

      - name: Auto-Update version.json & Release Notes
        run: |
          python3 -c "
          import json, subprocess
          tag = 'v4.0.${{ github.run_number }}'
          version_name = '4.0.${{ github.run_number }}'
          version_code = 40000 + int('${{ github.run_number }}')
          try:
              prev_tag = subprocess.check_output(['git', 'describe', '--tags', '--abbrev=0', '--match', 'v4.0.*'], stderr=subprocess.DEVNULL).decode('utf-8').strip()
              rev_range = f'{prev_tag}..HEAD'
          except Exception:
              rev_range = '-n 20'
          try:
              cmd = ['git', 'log', rev_range, '--pretty=format:%s'] if '..' in rev_range else ['git', 'log', '-n', '20', '--pretty=format:%s']
              commits = subprocess.check_output(cmd).decode('utf-8')
              changelog = []
              for raw in commits.splitlines():
                  msg = raw.strip()
                  if not msg:
                      continue
                  if 'auto-bump version.json' in msg.lower() or '[skip ci]' in msg.lower():
                      continue
                  if msg not in changelog:
                      changelog.append(msg)
              if not changelog:
                  changelog = ['Performance, stability, and AI engine improvements']
              changelog = changelog[:12]
          except Exception:
              changelog = ['Performance, stability, and AI engine improvements']
          data = {
              'appName': 'Agentra',
              'packageId': 'ai.agentra',
              'version_name': version_name,
              'version_code': version_code,
              'tag_name': tag,
              'channel': 'stable',
              'changelog': changelog
          }
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
          notes_lines = [f'### What\'s New in {tag}', '']
          notes_lines.extend([f'- {item}' for item in changelog])
          with open('RELEASE_NOTES.md', 'w') as nf:
              nf.write('\n'.join(notes_lines) + '\n')
          print('Successfully auto-updated version.json and RELEASE_NOTES.md for', tag)
          "

      - name: Commit Updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore(release): auto-bump version.json to v4.0.${{ github.run_number }} [skip ci]"
          git push origin main || true

      - name: Configure Gradle Wrapper Timeout & Permissions
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Signed APK
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000

      - name: Prepare Release Artifacts
        id: prep
        run: |
          VERSION_TAG="v4.0.${{ github.run_number }}"
          APK_NAME="Agentra-${VERSION_TAG}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          else
            cp app/build/outputs/apk/release/*-release.apk "${APK_NAME}"
          fi
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "Agentra ${{ steps.prep.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.prep.outputs.apk_path }}
            version.json
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
