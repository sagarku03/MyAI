name: Build & Release JARVIS AI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Prepare .env Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Decode Persistent Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding permanent repository keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Error: debug.keystore.base64 not found in repo root!"
            exit 1
          fi
          # Verify keystore integrity
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Configure Gradle Wrapper Timeout & Permissions
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000

      - name: Prepare Release Artifacts
        id: prep
        run: |
          VERSION_TAG="v4.0.${{ github.run_number }}"
          APK_NAME="JARVIS-AI-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "JARVIS AI ${{ steps.prep.outputs.tag }}"
          files: ${{ steps.prep.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
