name: Build & Release JARVIS AI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Prepare .env Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Restore Official Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release.jks from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          elif [ -f release.jks.base64 ]; then
            echo "Restoring release.jks from repository fallback..."
            base64 -d release.jks.base64 > release.jks
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from repository fallback..."
            base64 -d debug.keystore.base64 > release.jks
          else
            echo "Error: No release keystore found!"
            exit 1
          fi
          # Verify keystore integrity
          KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS || 'sagarjarvis' }}"
          STORE_PASS="${{ secrets.RELEASE_STORE_PASSWORD || 'sagar7846' }}"
          keytool -list -keystore release.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS"

      - name: Auto-Update version.json
        run: |
          python3 -c "
          import json, subprocess
          tag = 'v4.0.${{ github.run_number }}'
          version_name = '4.0.${{ github.run_number }}'
          version_code = 40000 + int('${{ github.run_number }}')
          try:
              commits = subprocess.check_output(['git', 'log', '-n', '5', '--pretty=format:- %s']).decode('utf-8')
              changelog = [c.strip('- ') for c in commits.splitlines() if c.strip()]
          except Exception:
              changelog = ['Continuous release build']
          data = {
              'appName': 'JARVIS AI',
              'packageId': 'com.jarvisai.assistant',
              'version_name': version_name,
              'version_code': version_code,
              'tag_name': tag,
              'channel': 'stable',
              'changelog': changelog
          }
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('Successfully auto-updated version.json to', tag)
          "

      - name: Commit Updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore(release): auto-bump version.json to v4.0.${{ github.run_number }} [skip ci]"
          git push origin main || true

      - name: Configure Gradle Wrapper Timeout & Permissions
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Signed APK
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'sagarjarvis' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'sagar7846' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'sagar7846' }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000

      - name: Prepare Release Artifacts
        id: prep
        run: |
          VERSION_TAG="v4.0.${{ github.run_number }}"
          APK_NAME="JARVIS-AI-${VERSION_TAG}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          else
            cp app/build/outputs/apk/release/*-release.apk "${APK_NAME}" || cp app/build/outputs/apk/debug/*.apk "${APK_NAME}"
          fi
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "JARVIS AI ${{ steps.prep.outputs.tag }}"
          files: |
            ${{ steps.prep.outputs.apk_path }}
            version.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
